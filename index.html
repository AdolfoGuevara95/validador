<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Facturas - Gasolinera Don Héctor</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f6f9; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <script>
    // 1. Capturar el ID de la factura desde el subdominio
    const urlParams = new URLSearchParams(window.location.search);
    const idFactura = urlParams.get('id') || '';

    // 2. Dirección base de tu Google Apps Script
    const scriptUrl = "https://script.google.com/macros/s/AKfycbz_tfIjl1ZaBUTdlzUuOqjCAcDpnrruBwcDHQgz6PAwTmdZZbWRtXKAr86MR3yX8uOb/exec";

    // 3. Crear el marco invisible que renderiza el diseño controlado desde Google Script
    const iframe = document.createElement('iframe');
    iframe.src = scriptUrl;
    document.body.appendChild(iframe);

    // 4. Una vez que el diseño estético de Google Script carga, le inyectamos los datos reales del Excel
    iframe.onload = function() {
      if(idFactura) {
        fetch(`${scriptUrl}?action=getData&id=${idFactura}`)
          .then(response => response.json())
          .then(data => {
            // Ejecuta la función de pintado que guardamos en el Index.html de Google Script
            iframe.contentWindow.inicializarVerificacion(data);
          })
          .catch(err => console.error("Error al obtener datos:", err));
      } else {
        iframe.contentWindow.inicializarVerificacion({resultado: "INVALIDA", mensaje: "No se proporcionó un código de factura."});
      }
    };
  </script>
</body>
</html>
