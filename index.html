<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Facturas - Gasolinera Don Héctor</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f6f9; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <script>
    // 1. Capturar el ID de la factura desde el subdominio
    const urlParams = new URLSearchParams(window.location.search);
    const idFactura = urlParams.get('id') || '';

    // 2. Dirección base de tu Google Apps Script
    const scriptUrl = "https://script.google.com/macros/s/AKfycbz_tfIjl1ZaBUTdlzUuOqjCAcDpnrruBwcDHQgz6PAwTmdZZbWRtXKAr86MR3yX8uOb/exec";

    // 3. Crear el marco que renderiza la web controlada desde Google Script pasando el ID directamente
    const iframe = document.createElement('iframe');
    iframe.src = idFactura ? `${scriptUrl}?id=${idFactura}` : scriptUrl;
    document.body.appendChild(iframe);
  </script>
</body>
</html>
